name: Update GPM Publications

on:
  workflow_dispatch:

  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  update-publications:

    runs-on: ubuntu-latest

    steps:

      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"

      - name: Update publications
        run: python update_publications.py

      - name: Save changes

        run: |
          git config user.name "GPM Publications Bot"
          git config user.email "actions@github.com"

          git add publications.json publications.html

          git diff --cached --quiet || git commit -m "Update publications"

          git push
