name: Actualizar comunicaciones de congresos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  update-conferences:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar script ORCID
        env:
          ORCID_ACCESS_TOKEN: ${{ secrets.ORCID_ACCESS_TOKEN }}
        run: |
          python orcid_conferences.py

      - name: Guardar archivos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            conference_publications.json \
            conference_publications_all_orcid.json \
            conference_publications_excluded.json \
            conference_publications.html \
            conference_publications.bib

          git diff --cached --quiet || git commit -m "Actualizar comunicaciones de congresos"

          git push
