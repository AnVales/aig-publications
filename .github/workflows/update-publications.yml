name: Actualizar publicaciones ORCID

on:
  workflow_dispatch:

jobs:
  actualizar-publicaciones:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Obtener token de ORCID
        env:
          ORCID_CLIENT_ID: ${{ secrets.ORCID_CLIENT_ID }}
          ORCID_CLIENT_SECRET: ${{ secrets.ORCID_CLIENT_SECRET }}
        run: |
          python - <<'PY'
          import os
          import requests

          response = requests.post(
              "https://orcid.org/oauth/token",
              headers={"Accept": "application/json"},
              data={
                  "client_id": os.environ["ORCID_CLIENT_ID"],
                  "client_secret": os.environ["ORCID_CLIENT_SECRET"],
                  "grant_type": "client_credentials",
                  "scope": "/read-public",
              },
              timeout=60,
          )

          response.raise_for_status()
          token = response.json()["access_token"]

          with open(os.environ["GITHUB_ENV"], "a") as file:
              file.write(f"ORCID_ACCESS_TOKEN={token}\n")
          PY

      - name: Ejecutar programa
        run: python orcid_publications.py
