name: Update publications

on:
  workflow_dispatch:
  push:
    paths:
      - "researchers.json"
      - "generate_publications.py"
      - "requirements.txt"
      - ".github/workflows/publications.yml"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate publication files
        run: python generate_publications.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update publications"
          file_pattern: "publications.json publications.html publications.bib"
